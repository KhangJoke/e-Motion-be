server {
    listen 80;
    server_name localhost;

    client_max_body_size 25M;

    # Ghi log chi tiết để dễ debug Webhook
    access_log /var/log/nginx/emotion_access.log;
    error_log /var/log/nginx/emotion_error.log warn;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;

        # Forward các header nhận dạng IP và Protocol từ Client/PayOS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình chống rớt kết nối và timeout webhook PayOS
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Tắt buffer cho các request thanh toán để callback được đẩy tức thì
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
